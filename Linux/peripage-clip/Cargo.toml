[package]
name = "peripage-clip"
version = "0.1.0"
edition = "2021"
description = "Print the Wayland clipboard (text or image) on a Peripage A6 over Bluetooth RFCOMM"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
